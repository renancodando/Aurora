name: publicar GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - "src/Aurora/wwwroot/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: preparar site
        shell: bash
        run: |
          mkdir -p _site
          cp -R src/Aurora/wwwroot/. _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: publicar
        id: deployment
        uses: actions/deploy-pages@v4
