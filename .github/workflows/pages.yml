name: preparar GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - "src/Aurora/wwwroot/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: preparar site
        shell: bash
        run: |
          rm -rf /tmp/aurora-pages
          mkdir -p /tmp/aurora-pages
          cp -R src/Aurora/wwwroot/. /tmp/aurora-pages/
          touch /tmp/aurora-pages/.nojekyll

      - name: atualizar branch gh-pages
        shell: bash
        run: |
          git config user.name "renancodando"
          git config user.email "245918264+renancodando@users.noreply.github.com"
          git checkout --orphan gh-pages-temp
          git rm -rf .
          cp -R /tmp/aurora-pages/. .
          git add -A
          git commit -m "atualiza Aurora web"
          git push --force origin HEAD:gh-pages
