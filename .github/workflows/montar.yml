name: montar Aurora

on:
  push:
    paths:
      - ".bootstrap/**"
      - ".github/workflows/montar.yml"

permissions:
  contents: write

jobs:
  montar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: montar projeto
        shell: bash
        run: |
          cat .bootstrap/parte-a1 .bootstrap/parte-a2 .bootstrap/parte-ab .bootstrap/parte-ac .bootstrap/parte-ad .bootstrap/parte-ae .bootstrap/parte-af | base64 -d > /tmp/aurora.tar.gz
          tar -xzf /tmp/aurora.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/build.yml
          git config user.name "renancodando"
          git config user.email "245918264+renancodando@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "cria o Aurora"
          git push
