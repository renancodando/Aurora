<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VÉRTICE</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#eef3f9;background:#050a11}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050a11;color:#eef3f9}body{overflow:hidden}
.hero{position:relative;min-height:100vh;overflow:hidden;background:
radial-gradient(circle at 78% 32%,rgba(100,126,172,.15),transparent 25%),
linear-gradient(180deg,#050a12 0%,#08121f 48%,#172035 76%,#05090f 100%)}
.estrelas,.estrelas:before,.estrelas:after{position:absolute;inset:0;content:"";background-image:
radial-gradient(circle,#fff 0 1px,transparent 1.3px),
radial-gradient(circle,#b9d4ff 0 1px,transparent 1.4px);
background-size:83px 83px,137px 137px;background-position:12px 16px,45px 72px;opacity:.42}
.estrelas:before{transform:translate(31px,17px);opacity:.32}.estrelas:after{transform:translate(-18px,42px);opacity:.2}
.nevoa{position:absolute;left:-8%;right:-8%;bottom:13%;height:44%;background:
radial-gradient(ellipse at 40% 65%,rgba(78,94,131,.19),transparent 34%),
radial-gradient(ellipse at 72% 42%,rgba(58,82,118,.16),transparent 28%)}
.montanhas{position:absolute;inset:auto -5% 0;height:34%;background:#05080d;clip-path:polygon(0 64%,7% 59%,15% 70%,22% 52%,31% 66%,38% 49%,47% 70%,57% 50%,65% 63%,74% 44%,83% 66%,91% 51%,100% 62%,100% 100%,0 100%)}
.montanhas:after{content:"";position:absolute;inset:42% 0 0;background:linear-gradient(180deg,transparent,#020407 70%)}
.luzes{position:absolute;left:0;right:0;bottom:12%;height:2px;background:linear-gradient(90deg,transparent 8%,rgba(232,190,117,.4) 15%,transparent 28%,rgba(232,190,117,.5) 48%,transparent 64%,rgba(232,190,117,.34) 78%,transparent 92%);filter:blur(.5px)}
.cabecalho{position:absolute;top:38px;left:62px;right:62px;height:48px;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid rgba(212,226,244,.09)}
.logo{font-size:19px;letter-spacing:.34em;font-weight:500}.nav{display:flex;gap:33px;font-size:10px;color:#a6b2c1}.nav span:first-child{color:#eaf2fb;border-bottom:1px solid #9abce8;padding-bottom:11px}.contato{border:1px solid rgba(194,215,240,.42);border-radius:7px;padding:10px 18px;font-size:10px}
.conteudo{position:absolute;left:10.5%;top:29%;width:40%;min-width:320px}.conteudo h1{font:400 clamp(45px,5.2vw,82px)/.94 Georgia,serif;letter-spacing:-.04em;margin:0 0 18px;max-width:8.2ch}.conteudo p{font-size:13px;line-height:1.6;color:#9fabb9;max-width:310px}.cta{display:inline-flex;margin-top:15px;padding:12px 20px;border:1px solid rgba(196,216,240,.42);border-radius:9px;background:rgba(107,137,177,.16);font-size:11px;color:#d9e8f9}
.grafico{position:absolute;left:54%;top:25%;width:40%;height:55%;border-left:1px solid rgba(197,215,239,.15)}
.grafico:before,.grafico:after{content:"";position:absolute;border:1px solid rgba(175,203,232,.18);border-left:0;border-bottom:0;border-radius:50%;width:250px;height:250px;left:-2px;top:6%;transform:rotate(45deg)}
.grafico:after{width:180px;height:180px;top:20%;opacity:.55}
.ponto{position:absolute;width:7px;height:7px;border:1px solid #dbe8f6;border-radius:50%;left:40%;top:42%;box-shadow:0 0 0 6px rgba(220,233,248,.04)}
.ideias{position:absolute;left:46%;top:9%;font-size:10px;line-height:1.75;letter-spacing:.22em;color:#a6b4c5}.tags{position:absolute;right:4%;bottom:17%;font-size:9px;line-height:1.8;letter-spacing:.22em;color:#768598}
@media(max-width:760px){.cabecalho{left:26px;right:26px}.nav{display:none}.conteudo{left:8%;width:70%;top:26%}.grafico{left:58%;opacity:.45}.conteudo h1{font-size:clamp(40px,11vw,62px)}}
</style>
</head>
<body>
<section class="hero">
<div class="estrelas"></div><div class="nevoa"></div><div class="montanhas"></div><div class="luzes"></div>
<header class="cabecalho"><div class="logo">VÉRTICE</div><div class="nav"><span>Início</span><span>Serviços</span><span>Portfólio</span><span>Contato</span></div><div class="contato">Fale Conosco</div></header>
<div class="conteudo"><h1>Estratégia que constrói o amanhã.</h1><p>Design, tecnologia e propósito para marcas que querem mais.</p><span class="cta">Começar agora&nbsp;&nbsp;→</span></div>
<div class="grafico"><div class="ideias">IDEIAS<br>ESTRUTURAM<br>REALIDADES</div><div class="ponto"></div><div class="tags">ESTRATÉGIA<br>DESIGN<br>TECNOLOGIA<br>RESULTADOS</div></div>
</section>
</body>
</html>
